# Activation requires Jenkins hosting/CD review and Jenkins-provisioned credentials.
# See docs/hosting.md. A manual trigger never bypasses ci.jenkins.io verification.
name: Jenkins release
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate and draft release notes without publishing
        type: boolean
        default: true
permissions:
  checks: read
  contents: write
jobs:
  maven-cd:
    if: github.repository == 'jenkinsci/awarely-scan-plugin' && github.ref == 'refs/heads/main' && vars.JENKINS_CD_APPROVED == 'true'
    uses: jenkins-infra/github-reusable-workflows/.github/workflows/maven-cd.yml@c2470861b1ad94810dc0d207b011e0b57bb91bbb # v1
    with:
      validate_only: ${{ inputs.validate_only == true }}
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
